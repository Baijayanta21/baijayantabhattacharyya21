/* =========================================================
   RESET
========================================================= */

* {box-sizing: border-box;}

html {
scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    
    background:white;
    color: blue;
    
    font-family: "Baskerville", serif;
    font: 500 2rem;
    
    line-height: 1.6;
    letter-spacing: 0.01em;
    
    
    max-width: 1350px;
    margin: 0 auto;
}


    /* =========================================================
       PAGE
    ========================================================= */

    .page {
      width: min(1450px, calc(100% - 80px));
      margin: 0 auto;
      padding: 70px 0 100px;
    }


   

/* =========================================================
   FILTER BAR
========================================================= */

.filter-section {
  margin-bottom: 45px;
}

.filter-top {
  display: flex;
    
  justify-content: space-between;
  align-items: center;
  color: #c02b7f;
  margin-bottom: 18px;
}

.filter-title {
  
  font-size: 25px;
  font-weight: 550;
  letter-spacing: 0.15em;
}

.movie-count {

  font-size: 25px;
  font-weight: 550;
  letter-spacing: 0.05em;



}

.genres {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.genre-btn {
  appearance: none;

  border: 1px solid #393937;
  background: transparent;


  padding: 7px 15px;

  border-radius: 10px;

    font-size:23px;
  font-family: "EB Garamond", Georgia, serif;


  letter-spacing: 0.04em;

  cursor: pointer;

  transition:
    background 0.25s ease,
    color 0.25s ease,
    border-color 0.25s ease;
}

.genre-btn:hover {
    color: #9700ff;
}

.genre-btn.active {
  background: #e8e2d7;
  border-color: #e8e2d7;

  color: #171818;
  border-radius: 10px;
}


/* =========================================================
   MOVIE GRID
========================================================= */

.movies {
  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(220px, 1fr));

  gap: 20px 15px;

}


/* =========================================================
   MOVIE CARD
========================================================= */

.movie {
  position: relative;

  min-width: 0;

  overflow: hidden;

  cursor: pointer;

  border: 1px solid #a27a36;
  border-radius: 15px;

  background:white;
  color:red;

  transition:
    transform 0.35s cubic-bezier(.2,.7,.2,1),
    box-shadow 0.35s ease,
    border-color 0.35s ease;
}

.movie:hover {
  transform: scale(1.05);
  border: 1.25px solid #a27a36;

  box-shadow:
    0 14px 30px rgba(0, 0, 0, 0.28);
}


/* =========================================================
   POSTER
========================================================= */

.poster {
  position: relative;

  aspect-ratio: 2 / 3;

  overflow: hidden;

  background: #1c1d1d;
  border-bottom:1.25px solid black;
}

.poster img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  transition:
    transform 0.6s cubic-bezier(.2,.7,.2,1),
    filter 0.5s ease;
}

.movie:hover .poster img {
  transform: scale(1.1);
    filter: brightness(1);
}






/* =========================================================
 HOVER OVERLAY
========================================================= */

.poster-overlay {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: flex-end;

  padding: 20px;

  opacity: 0;

  background:linear-gradient(
      to top,
      rgba(0,0,0,0.7),
      rgba(0,0,0,0.05) 95%
    );

  transition: opacity 0.35s ease;
}

.movie:hover .poster-overlay {
  opacity: 1;
}


.imdb-link {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;

  color: #f1ede5;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  font-family: Georgia, sans-serif;
  backdrop-filter: blur(5px);

  transition:
    background 0.25s ease,
    border-color 0.25s ease;
}
      
.imdb-link {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;

  color: #f1ede5;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.12em;
  font-family: Georgia, sans-serif;

  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;

  transition: color 0.25s ease;
}

.imdb-link span {
  font-size: 15px;
}

/* =========================================================
MOVIE INFORMATION
========================================================= */

.movie-info {
  display: flex;
  flex-direction: column;
  align-items: center;
font-size: 21px;
font-weight:550}

    

.movie-meta {
    display: flex;
    align-items: center;
    gap: 8px;

    color: brown;

    color: brown;

color:blue;}

    
    /* =========================================================
       EMPTY STATE
    ========================================================= */

    .empty {
      grid-column: 1 / -1;

      padding: 100px 20px;

      text-align: center;

      color: #77746e;
    }





    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 900px) {

      .page {
        width: min(100% - 40px, 700px);
        padding-top: 50px;
      }

      .movies {
        grid-template-columns:

        gap: 35px 18px;
      }

      .header h1 {
        font-size: clamp(4rem, 16vw, 6rem);
      }

    }


    @media (max-width: 500px) {

      .page {
        width: calc(100% - 28px);
        padding-top: 35px;
      }

      .movies {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 30px 12px;
      }

      .movie-info h3 {
        font-size: 20px;
      }

      .header {
        margin-bottom: 40px;
      }

      .header-description {
        font-size: 14px;
      }

      .footer {
        flex-direction: column;
        gap: 5px;
      }

    }

</head>

        const button = document.createElement("button");

        button.className = "genre-btn";

        if (genre === "All") {
          button.classList.add("active");
        }

        button.textContent = genre;

        button.addEventListener("click", () => {

          document
            .querySelectorAll(".genre-btn")
            .forEach(btn => btn.classList.remove("active"));

          button.classList.add("active");

          renderMovies(
            genre === "All" ? null : genre
          );

        });

        genresDiv.appendChild(button);

      });

    }


    /* ========================================================
       RENDER MOVIES
    ======================================================== */

    function renderMovies(filterGenre = null) {

      moviesDiv.innerHTML = "";

      let filteredMovies = filterGenre
        ? movies.filter(movie =>
            movie.genres.includes(filterGenre)
          )
        : [...movies];


      /* Highest rated first */

      filteredMovies.sort(
        (a, b) => b.rating - a.rating
      );


      movieCount.textContent =
        `${filteredMovies.length} film${filteredMovies.length !== 1 ? "s" : ""}`;


      if (filteredMovies.length === 0) {

        moviesDiv.innerHTML = `
          <div class="empty">
            No films found.
          </div>
        `;

        return;
      }


  filteredMovies.forEach(movie => {

    const card = document.createElement("article");

    card.className = "movie";

    card.innerHTML = `

      <div class="poster">

        <img
          src="https://image.tmdb.org/t/p/w500${movie.poster_path}"
          alt="${movie.title}"
          loading="lazy"
        >

        <div class="poster-overlay">

          <span class="imdb-link">
            View on IMDb
            <span>»</span>
          </span>

        </div>

      </div>


      <div class="movie-info">

        <div class="movie-meta">

          <span>
            ${movie.year}
          </span>

        

          <span class="movie-rating">
            <span>★</span> ${movie.rating}
          </span>

        </div>

        <div class="movie-genres">
          ${movie.genres.join(" · ")}
        </div>

      </div>

    `;


          card.addEventListener("click", () => {

          window.open(
            movie.imdb,
            "_blank",
            "noopener,noreferrer"
          );

        });


        moviesDiv.appendChild(card);

      });

    }


    /* ========================================================
       INITIALIZE
    ======================================================== */

    renderGenres();
    renderMovies();

  </script>

</body>
</html>
